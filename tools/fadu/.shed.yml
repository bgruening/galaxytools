long_description: |
  FADU (Feature Aggregate Depth Utility) is a quantification tool designed
  specifically for prokaryotic transcriptomics. Because prokaryotic transcripts
  are frequently polycistronic (operons), fragments often span several
  neighbouring features; FADU assigns each fragment fractional counts in
  proportion to the portion of the fragment overlapping the non-overlapping
  part of each GFF3 feature. It takes a position-sorted BAM and a GFF3
  annotation and writes a tab-delimited table of featureID, uniq_len,
  num_alignments, counts and tpm.

  Deployment note: the bioconda package for FADU is built with
  `container: extended-base: true` (the bundled Julia/libLLVM stack requires
  libz.so.1). Instances that resolve tool dependencies with conda must use the
  extended base dependency container.
