name: pynxtools_dataconverter
owner: bgruening
description: Convert raw data to NeXus with pynxtools
long_description: |
    Converts a raw file and its ELN to NeXus with pynxtools and its reader plugins (pynxtools-spm:
    NXstm, NXsts, NXafm). A failed file is recorded with its reason instead of failing the job.
homepage_url: https://github.com/FAIRmat-NFDI/nomad-eosc-galaxy-actions
