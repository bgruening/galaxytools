long_description: |
  yq is a lightweight and portable command-line YAML, JSON, XML, CSV, TSV, TOML,
  HCL, INI and properties processor that uses jq-like syntax. This wrapper exposes
  the eval and eval-all commands, enabling querying, transforming and converting
  structured data files within Galaxy workflows.
