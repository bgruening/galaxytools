---
name: drs_transcript_prediction
owner: bgruening
license: AGPL-3.0-only
description: Predict transcripts from candidate start/stop sites in direct RNA sequencing reads
long_description: |
  TP (Transcript Prediction) predicts transcripts from direct RNA sequencing (dRNA-seq)
  reads. Candidate transcript start and stop sites are located from sharp read-depth
  changes within distinct, non-overlapping per-strand genomic ranges, and alternative
  transcripts that could share the same start/stop combinations are filtered out with a
  read-count and read-assignment ratio model. Outputs candidate transcripts (BED),
  predicted transcripts (BED) and predicted transcripts (GFF3).
categories:
- Transcriptomics
- RNA
- Nanopore
