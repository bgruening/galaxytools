name: zenodo_nomad_harvest
owner: bgruening
description: Harvest scanning probe microscopy (SPM) data from Zenodo into NeXus for NOMAD
long_description: |
    Tools of the Zenodo to Galaxy to NOMAD harvest. They download and safely extract the files
    of a Zenodo work list, build an ELN per raw scanning probe microscopy (SPM) file from the
    record metadata and context files, convert the raw files to NeXus with pynxtools and
    pynxtools-spm (NXstm, NXsts, NXafm), and build the results, NOMAD project zips and logs.
    A failed file is recorded with its reason instead of failing the job.
homepage_url: https://github.com/FAIRmat-NFDI/nomad-eosc-galaxy-actions
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/zenodo_nomad_harvest
type: unrestricted
categories:
  - Data Source
  - Materials science
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for {{ tool_name }}, part of the Zenodo to NOMAD harvest."
suite:
  name: "suite_zenodo_nomad_harvest"
  description: "Tools to harvest SPM data from Zenodo, convert it to NeXus and prepare NOMAD projects."
  type: repository_suite_definition
