# Rules for the LLM-written ELN, read by nexus_llm_input (and later the check step).
# scan_mode values: from the NeXus definitions in pynxtools, contributed_definitions/NX*.nxdl.xml
# (definitions commit bce2549). Update them, and eln_instructions/, when the definitions change.

definitions:
  NXstm:
    technique: STM
    instructions: eln_instructions/NXstm.txt
    scan_mode: [constant height, constant current]
  NXsts:
    technique: STS
    instructions: eln_instructions/NXsts.txt
    scan_mode: [constant height, constant current, constant spacing]
  NXafm:
    technique: AFM
    instructions: eln_instructions/NXafm.txt
    scan_mode: [contact mode, tapping mode, non-contact mode, peak force tapping mode]

# Fields the LLM may fill when the rule ELN has no value; missing ones are set to null.
fill:
  - Instrument.hardware.model
  - Instrument.hardware.model/@version
  - Instrument.software.model
  - Sample.History.Note.description
  - Sample.Sample_component.chemical_formula
  - Sample.Sample_component.description
  - Sample.Sample_component.name
  - Sample.name
  - scan_mode

# Fields the LLM always writes: set to null even when the rule ELN has a value. The rule
# value stays the fallback (experiment_description: the record text, also in citeID.description).
replace:
  - experiment_description

# Fields whose value must be one of the definition's allowed values (check step).
exact:
  - scan_mode

# Fields whose value itself must be in its quote, ignoring spaces, dashes and case (check step).
literal:
  - Instrument.hardware.model
  - Instrument.hardware.model/@version
  - Instrument.software.model
  - Sample.Sample_component.chemical_formula
