name: 3dtrees_sidecar
owner: bgruening
description: Store method results as sidecars and assemble point clouds.
homepage_url: https://github.com/3dTrees-earth/3dtrees_sidecar
long_description: |
  Export stores chosen columns of one method's result as a Parquet sidecar,
  joined to the standardized point cloud by point index. Assemble joins any
  selection of sidecars onto the standardized point cloud as a LAZ download.
  Check rebuilds a download from the same inputs and compares it value by
  value. Each task writes a JSON report with point counts, columns and hashes.
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/3dtrees_sidecar
type: unrestricted
categories:
- "Geo Science"
