name: 3dtrees_sidecar
owner: bgruening
description: Export point-cloud predictions as indexed sidecars, assemble and check downloadable point clouds.
homepage_url: https://github.com/3dTrees-earth/3dtrees/tree/main/tools/tool_sidecar
long_description: |
  Export stores one method's added point dimensions as a Parquet sidecar
  indexed to its standard base point cloud and refuses outputs whose points or
  point order changed. Assemble joins any selection of sidecars onto the base as
  a downloadable LAZ. Check rebuilds a published point cloud from its base and
  sidecars and compares every dimension point by point. Each task writes a JSON
  report with hashes, point counts and dimensions.
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/3dtrees_sidecar
type: unrestricted
categories:
- "Geo Science"
