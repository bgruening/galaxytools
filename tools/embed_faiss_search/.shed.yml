name: embed_faiss_search
owner: bgruening
description: Look up entities in a FAISS knowledge-base index
long_description: |
  Embeds the mention of every entity with a sentence-transformers model and finds the nearest entries in a FAISS
  index of a knowledge base, such as ToposText. The index and a metadata JSON Lines file are tool inputs.
