class: GalaxyWorkflow
label: Merge a collection of Salmon quantifications
doc: Regression workflow ensuring that quantmerge reduces a list collection to one dataset.
license: MIT
creator:
  - class: Organization
    name: The galaxytools repository contributors
    url: https://github.com/bgruening/galaxytools

inputs:
  quantifications:
    type: collection
    collection_type: list

outputs:
  merged:
    outputSource: merge/mergedfile

steps:
  merge:
    tool_id: salmonquantmerge
    doc: Preserve collection element names and their corresponding quantification values.
    state:
      quants:
        $link: quantifications
      column: numreads
      genes: false
      missing: 0
