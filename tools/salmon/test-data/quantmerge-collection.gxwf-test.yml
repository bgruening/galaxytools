- doc: Reduce a collection to one matrix, preserving distinct sample identities and values.
  job:
    quantifications:
      class: Collection
      collection_type: list
      elements:
        - identifier: sample.one
          class: File
          path: sample.one
          filetype: tabular
        - identifier: sample_one
          class: File
          path: sample_one
          filetype: tabular
        - identifier: sample_one_2
          class: File
          path: sample_one_2
          filetype: tabular
  outputs:
    merged:
      asserts:
        has_line:
          line: "Name\tsample_one\tsample_one_3\tsample_one_2"
        has_text_matching:
          expression: "(?m)^tx_shared\t1\t3\t5$"
        has_n_lines:
          n: 4
        has_n_columns:
          n: 4
- doc: Collection identifiers that begin with a hyphen must remain sample names.
  job:
    quantifications:
      class: Collection
      collection_type: list
      elements:
        - identifier: --genes
          class: File
          path: sample.one
          filetype: tabular
        - identifier: normal
          class: File
          path: sample_one
          filetype: tabular
  outputs:
    merged:
      asserts:
        has_line:
          line: "Name\t_--genes\tnormal"
        has_text_matching:
          expression: "(?m)^tx_shared\t1\t3$"
        has_n_lines:
          n: 4
