name: protein_lm
owner:
description: Embed, predict, and LoRA fine-tune with protein language models (ESM-2, ProtBERT, ProtT5).
long_description: |
  Runs Hugging Face protein language models (ESM-2, ProtBERT, or ProtT5 --
  auto-detected from the model's config.json) in three modes: extracting
  per-residue (H5) and per-protein (TSV) embeddings from a FASTA file,
  training a scikit-learn classifier/regressor on those embeddings, and
  LoRA fine-tuning the encoder itself for classification or regression.
  Model weights are provided either by a Galaxy administrator through the
  shared "huggingface" data table, or uploaded directly as a model archive.
  No network access is required at runtime.
