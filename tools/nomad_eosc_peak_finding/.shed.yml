name: nomad_eosc_peak_finding
owner: bgruening
categories:
  - Chemistry
description: Peak finding in XPS NeXus spectra, written back as NXfit/NXpeak
long_description: |
    Finds peaks in an X-ray photoelectron spectroscopy (XPS) spectrum stored in a
    NeXus/HDF5 file and appends them to a copy of that file as a standard NXfit
    group with one NXpeak child per detected peak, alongside a tabular and a JSON
    peak table. This is the peak-finding step of the NOMAD/EOSC demonstrator that connects
    NOMAD to Galaxy, ported from the standalone demo in nomad-eosc-galaxy-actions.
homepage_url: https://github.com/FAIRmat-NFDI/nomad-eosc-galaxy-actions
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/nomad_eosc_peak_finding
type: unrestricted