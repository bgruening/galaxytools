description: Create publication-ready Kaplan-Meier survival curves using R survminer
long_description: |
  This tool creates publication-ready survival curves (Kaplan-Meier plots) using
  the R survminer package's ggsurvplot() function. It supports number-at-risk
  tables, confidence intervals, log-rank test p-values, and customizable
  appearance options.
