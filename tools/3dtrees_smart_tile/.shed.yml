name: 3dtrees_smart_tile
owner: bgruening
description: Tile, filter, merge and remap LiDAR predictions and create merged products.
homepage_url: https://github.com/3dTrees-earth/3dtrees_Smart_Tile
long_description: |
  SmartTile prepares spatial or whole-instance point-cloud tiles, filters
  and merges segmented tiles, remaps predictions onto the originals, and
  creates full-resolution or subsampled LAZ, COPC LAZ and PLY products.
