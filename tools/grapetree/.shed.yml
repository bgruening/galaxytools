name: grapetree
owner: bgruening
description: Visualization of core genomic relationships among bacterial pathogens
long_description: |
  GrapeTree is a tool for visualizing core genomic relationships among 100,000 bacterial pathogens.
  Supports multiple tree-building methods (NJ, MSTreeV2) and produces Newick tree output.
