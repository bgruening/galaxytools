name: 3dtrees_inventory
owner: bgruening
description: Tree inventory (position, DBH, height, crown, species) per instance of segmented point clouds.
homepage_url: https://github.com/3dTrees-earth/3dtrees_CSP_StandSegmentation
long_description: |
  Measures every tree of one or more existing instance segmentations of a
  full-resolution LAS/LAZ or COPC point cloud with the CspStandSegmentation
  forest inventory: stem position and DBH from stem slices, height, crown
  area and species, with the DBH fit evidence per tree. Optionally creates a
  comparative shortest path (CSP) segmentation. Writes the inventory as CSV
  and Parquet, a stand summary and the terrain model.
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/3dtrees_inventory
type: unrestricted
categories:
- "Geo Science"
