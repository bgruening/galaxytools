name: pynxtools_spm
owner: bgruening
description: Convert scanning probe microscopy data to NeXus with pynxtools-spm
long_description: |
    Converts an SPM raw file and its ELN to NeXus with pynxtools and pynxtools-spm (NXstm, NXsts,
    NXafm), and reads raw file headers with gwyddionpy. A failed file is recorded with its reason
    instead of failing the job.
homepage_url: https://github.com/FAIRmat-NFDI/nomad-eosc-galaxy-actions
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/pynxtools_spm
type: unrestricted
categories:
  - Convert Formats
  - Materials science
