---
name: ciriquant
description: circRNA detection and quantification from paired-end RNA-Seq data
categories:
- RNA
- Transcriptomics
owner: bgruening
homepage_url: https://github.com/bioinfo-biols/CIRIquant
long_description: |
  Galaxy wrappers for CIRIquant, a pipeline that detects and quantifies circular
  RNAs from paired-end RNA-Seq data (HISAT2 alignment, CIRI2 de novo detection,
  BWA based back-splice/forward-splice junction quantification and StringTie
  based host gene normalization), together with the CIRI_DE pairwise
  differential expression utility and the prep_CIRIquant count matrix builder
  for replicate based analyses.
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/ciriquant
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Galaxy wrapper for the CIRIquant utility {{ tool_name }}"
suite:
  name: "suite_ciriquant"
  description: "Galaxy wrappers for CIRIquant and its companion utilities"
  type: repository_suite_definition
