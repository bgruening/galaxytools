name: new_fave
owner: bgruening
description: Extract and analyze vowel formants from audio with new-fave.
long_description: |
  new-fave extracts and analyzes vowel formants from audio file/TextGrid pairs
  It supports formant tracking, vowel label recoding, and optimization, 
  producing formant measurements and recoded TextGrids.
type: unrestricted
categories:
  - Natural Language Processing
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/new_fave
homepage_url: https://forced-alignment-and-vowel-extraction.github.io/new-fave/
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for the phonetic analysis tool: {{ tool_name }}"