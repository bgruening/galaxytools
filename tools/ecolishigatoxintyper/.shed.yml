description: E. coli Shiga toxin typing pipeline
long_description: |
  Comprehensive Shiga toxin typing pipeline for Escherichia coli.
  Performs quality assessment (FastQC), trimming (Trimmomatic),
  filtering (DUK), assembly (SPAdes, SKESA), alignment (MUSCLE),
  and BLAST-based Shiga toxin subtyping using the SSI/DTU database.
