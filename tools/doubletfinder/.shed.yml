categories:
- Single-cell
description: DoubletFinder detects doublets in single-cell RNA-seq data using artificial nearest neighbors
homepage_url: https://github.com/chris-mcginnis-ucsf/DoubletFinder
long_description: |
  DoubletFinder is an R package that predicts doublets in single-cell RNA
  sequencing data. It artificially creates doublets from existing data,
  embeds them alongside real cells in PCA space, and computes the proportion
  of artificial nearest neighbors (pANN) for every real cell. pANN values are
  then thresholded according to the expected number of doublets to produce
  final doublet predictions.

  This Galaxy wrapper implements the standard workflow (paramSweep,
  summarizeSweep, find.pK and doubletFinder) with support for automatic or
  manual pK selection, expected doublet rates or counts, and homotypic
  doublet adjustment via modelHomotypic.
name: doubletfinder
owner: bgruening
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/doubletfinder
