categories:
  - Sequence Analysis
description: ProteinOrtho detects (co-)orthologous genes within different species.
homepage_url: https://gitlab.com/paulklemm_PHD/proteinortho
long_description: |
  ProteinOrtho is a versatile tool to detect (co-)orthologous genes within
  different species. It performs an all-against-all similarity comparison of
  the input FASTA files and partitions the resulting similarity graph into
  orthologous gene groups. The PoFF extension additionally uses the gene order
  (synteny) to separate similar sequences.
name: proteinortho
owner: bgruening
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/proteinortho
type: unrestricted
