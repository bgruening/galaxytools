name: zenodo_nomad_download
owner: bgruening
description: Download Zenodo records for the NOMAD harvest and safely extract their archives
long_description: |
    Downloads the files of Zenodo records listed in a NOMAD harvest work list (MD5 checked), extracts archives
    safely and sorts the files into raw, context and ignored files. Writes a manifest and one
    context bundle per raw file, with the text of readme and PDF context files.
homepage_url: https://github.com/FAIRmat-NFDI/nomad-eosc-galaxy-actions
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/zenodo_nomad_download
type: unrestricted
categories:
  - Data Source
