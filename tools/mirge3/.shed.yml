name: mirge3
owner: bgruening
description: Comprehensive microRNA and tRF sequencing analysis pipeline
homepage_url: https://github.com/mhalushka/miRge3.0
long_description: |
  miRge3.0 is a comprehensive Python pipeline for small RNA-seq data analysis.
  It performs adapter trimming (via cutadapt), read collapsing, alignment against
  miRNA reference libraries (via bowtie), known miRNA quantification, isomiR
  analysis, A-to-I editing detection, tRNA fragment (tRF) analysis, novel miRNA
  prediction, UMI processing, differential expression (via DESeq2), and produces
  an interactive HTML visualization report.
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/mirge3
type: unrestricted
categories:
- RNA
- Sequence Analysis
- Transcriptomics
