name: spacy_hf_ner
owner: bgruening
description: Find named entities with spaCy pipelines from Hugging Face
long_description: |
  Runs one or more spaCy named-entity recognition pipelines, downloaded from the Hugging Face Hub, over plain text,
  TEI/XML or JSON Lines. Returns one JSON Lines file with the entities and their character positions.
