name: black_forest_labs_flux
owner: bgruening
description: Generate and edit images with the FLUX models by Black Forest Labs.
long_description: |
  Generates images from a text prompt with the FLUX models by Black Forest Labs
  (FLUX.1 [dev], FLUX.1 [schnell], FLUX.2 [klein] 4B and FLUX 3 Image Klein).
  FLUX.2 [klein] and FLUX 3 Image Klein also edit images from reference images.
  The models are read from the shared huggingface data table.
