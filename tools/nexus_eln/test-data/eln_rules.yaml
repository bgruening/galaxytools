# Rules for the ELN tools (nexus_eln_builder, nexus_llm_input, nexus_eln_llm_merge). A copy of
# pynxtools-spm's src/pynxtools_spm/galaxy/eln_rules.yaml, used by the tests; keep both the same.
# scan_mode values: from the NeXus definitions in pynxtools, contributed_definitions/NX*.nxdl.xml
# (definitions commit bce2549). Update them, and eln_instructions.md, when the definitions change.

# extensions: raw file extensions (lower case). header_markers: regular expressions searched in
# the header, read as "key: value" and "channel: <name>" lines (a text header as it is); when only
# one definition's markers match, it is the technique (else the extension decides).
definitions:
  NXstm:
    technique: STM
    extensions: [.sxm, .sm4]
    header_markers: []
    scan_mode: [constant height, constant current]
  NXsts:
    technique: STS
    extensions: [.dat]
    header_markers: []
    scan_mode: [constant height, constant current, constant spacing]
  NXafm:
    technique: AFM
    extensions: [.spm, .txt, .flt]
    header_markers:
      # Nanonis .sxm: AFM channels, an oscillation controller that is on.
      - '\bFrequency_Shift\b'
      - 'Amplitude controller on:\s*TRUE'
      # Bruker NanoScope .spm and .flt: the microscope mode in words.
      - '(^|::)(MicroscopeList|Mode): .*(Tapping|Contact|ScanAsyst)'
    scan_mode: [contact mode, tapping mode, non-contact mode, peak force tapping mode]

# Fields the LLM may fill when the rule ELN has no value; missing ones are set to null.
fill:
  - Instrument.hardware.model
  - Instrument.hardware.model/@version
  - Instrument.software.model
  - Sample.History.Note.description
  - Sample.Sample_component.chemical_formula
  - Sample.Sample_component.description
  - Sample.Sample_component.name
  - Sample.name
  - scan_mode

# Fields the LLM always writes: set to null even when the rule ELN has a value. The rule
# value stays the fallback (experiment_description: the record text, also in citeID.description).
replace:
  - experiment_description

# Fields that may be filled from the raw file header alone (check step); a value of another
# field needs a quote from a context file.
header:
  - Instrument.hardware.model
  - Instrument.hardware.model/@version
  - Instrument.software.model
  - scan_mode

# Fields whose value must be one of the definition's allowed values (check step).
exact:
  - scan_mode

# Fields whose value itself must be in its quote, ignoring spaces, dashes and case (check step).
literal:
  - Instrument.hardware.model
  - Instrument.hardware.model/@version
  - Instrument.software.model
  - Sample.Sample_component.chemical_formula
