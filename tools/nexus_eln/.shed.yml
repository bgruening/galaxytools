name: nexus_eln
owner: bgruening
description: Build the ELN for NeXus conversion, optionally with an LLM
long_description: |
    Builds the ELN (eln_data.yaml) that the NeXus converter reads besides a raw file: from the
    record metadata, context files and raw file header; optionally checks and merges values an LLM
    proposed, keeping only values quoted from the dataset files.
homepage_url: https://github.com/FAIRmat-NFDI/nomad-eosc-galaxy-actions
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/nexus_eln
type: unrestricted
categories:
  - Materials science
auto_tool_repositories:
    name_template: "{{ tool_id }}"
    description_template: "NeXus ELN tool: {{ tool_name }}."
suite:
    name: "suite_nexus_eln"
    description: "Tools to build the ELN for NeXus conversion, optionally checked with an LLM."
    long_description: |
        Builds the ELN (eln_data.yaml) that the NeXus converter reads besides a raw file: from the
        record metadata, context files and raw file header; optionally checks and merges values an LLM
        proposed, keeping only values quoted from the dataset files.
