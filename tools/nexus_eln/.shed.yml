name: nexus_eln
owner: bgruening
description: Build the ELN for NeXus conversion, optionally with an LLM
long_description: |
    Builds the ELN (eln_data.yaml) that the NeXus converter reads besides a raw file: from the
    record metadata, context files and raw file header; optionally checks and merges values an LLM
    proposed, keeping only values quoted from the dataset files.
