# Test data comes from the tools' test-data folders in the local galaxytools clone.
# All tests run with the LLM off ("use llm: false"), so they need no LLM server.
- doc: >-
    One record with an archive, loose files and every failure case; one raw file converts.
    The LLM is off, so the converted ELN is the rule ELN.
  job:
    work list:
      class: File
      path: ../../tools/zenodo_nomad_harvest/test-data/work_list.json
      filetype: json
    prefetched files:
      class: Collection
      collection_type: list
      elements:
        - identifier: stm_archive.zip
          class: File
          path: ../../tools/zenodo_nomad_harvest/test-data/stm_archive.zip
          filetype: zip
        - identifier: traversal.zip
          class: File
          path: ../../tools/zenodo_nomad_harvest/test-data/traversal.zip
          filetype: zip
        - identifier: loose_readme.rtf
          class: File
          path: ../../tools/zenodo_nomad_harvest/test-data/loose_readme.rtf
          filetype: txt
        - identifier: loose_raw.sxm
          class: File
          path: ../../tools/zenodo_nomad_harvest/test-data/loose_raw.sxm
          filetype: binary
        - identifier: loose_mismatch.txt
          class: File
          path: ../../tools/zenodo_nomad_harvest/test-data/loose_mismatch.txt
          filetype: txt
    use llm: false
  outputs:
    manifest:
      asserts:
        - that: has_text
          text: '"tool_version": "pynxtools_dataconverter 0.5.0+galaxy0"'
        - that: has_text
          text: '"reason": "unsafe_path"'
    results:
      asserts:
        - that: has_text
          text: '"run_id": "test-batch-001"'
        - that: has_text
          text: '"status": "success"'
          n: 1
        - that: has_text
          text: '"status": "failed"'
          n: 2
        - that: has_text
          text: '"nexus_path": "10.5281_zenodo.17533355/const_dos_No14_003/const_dos_No14_003.nxs"'
    projects:
      element_tests:
        "17533355":
          asserts:
            - that: has_archive_member
              path: 10.5281_zenodo.17533355/const_dos_No14_003/const_dos_No14_003.nxs
            - that: has_archive_member
              path: 10.5281_zenodo.17533355/const_dos_No14_003/eln_data.yaml
    eln llm reports:
      element_tests:
        17533355-bde42f7aaf67-const_dos_No14_003.sxm:
          asserts:
            - that: has_text
              text: '"status": "no_answer"'
    eln files:
      element_tests:
        17533355-bde42f7aaf67-const_dos_No14_003.sxm:
          asserts:
            - that: has_text
              text: "# LLM step: no_answer"
            - that: has_text
              text: "experiment_description: 'Magnetic adatom chains on a superconductor"
            # The work list's user is the ELN's only user.
            - that: has_text
              text: "- name: Test Person"
    logs:
      element_tests:
        10.5281_zenodo.17533355:
          asserts:
            - that: has_text
              text: "STM data/session 1/const_dos_No14_003.sxm: success"
- doc: A work list without records still completes, with empty results.
  job:
    work list:
      class: File
      path: ../../tools/zenodo_nomad_harvest/test-data/work_list_empty.json
      filetype: json
    use llm: false
  outputs:
    results:
      asserts:
        - that: has_text
          text: '"files": []'
- doc: >-
    A context file whose type Galaxy cannot detect (binary bytes in a .csv, like the .h5_met files
    of Zenodo record 7371527) still reaches the report step, so the invocation is scheduled.
  job:
    work list:
      class: File
      path: ../../tools/zenodo_nomad_harvest/test-data/work_list_loose.json
      filetype: json
    prefetched files:
      class: Collection
      collection_type: list
      elements:
        - identifier: loose_readme.rtf
          class: File
          path: ../../tools/zenodo_nomad_harvest/test-data/loose_readme.rtf
          filetype: txt
        - identifier: loose_raw.sxm
          class: File
          path: ../../tools/zenodo_nomad_harvest/test-data/loose_raw.sxm
          filetype: binary
        - identifier: context_unknown.csv
          class: File
          path: ../../tools/zenodo_nomad_harvest/test-data/context_unknown.csv
          filetype: binary
    use llm: false
  outputs:
    results:
      asserts:
        - that: has_text
          text: '"run_id": "test-loose-001"'
    logs:
      element_tests:
        "10.5281_zenodo.17533355":
          asserts:
            - that: has_text
              text: "context_unknown.csv"
