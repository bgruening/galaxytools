name: Tool Update
description: Request an update to an existing Galaxy tool wrapper
# Prefixed label is canonical. If your repo uses the legacy unprefixed labels,
# change this to "tool-update".
labels: ["tool-bot:tool-update"]
body:
  - type: markdown
    attributes:
      value: |
        Fill out this form to request an update to an existing tool wrapper.
        The bot will review the current wrapper and post an update plan as a comment.
        A maintainer will then review and approve it for implementation.
  - type: input
    id: tool-dir
    attributes:
      label: Tool directory
      description: Name of the existing tool directory under `tools/` (e.g. `samtools_sort`)
      placeholder: e.g. samtools_sort
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What to change
      description: What should be updated? (version bump, new parameters, bug fixes, ...)
      placeholder: |
        e.g. Bump from 1.20 to 1.21 and add the new --verbosity flag
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Relevant URLs — upstream release notes, changelog, docs, issue/PR
      placeholder: |
        https://github.com/samtools/samtools/releases/tag/1.21
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Contact
      description: GitHub handle for follow-up questions (optional)
      placeholder: "@your-github-handle"
    validations:
      required: false
