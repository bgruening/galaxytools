# Fork-PR notifier for the label-triggered flows.
#
# Workflows triggered by `pull_request` events from forks get a read-only
# GITHUB_TOKEN and no secrets, so the review and address-feedback flows refuse
# them up front (see the fork checks in on-pr-feedback.yml / on-pr-review.yml)
# — and can't even post a comment explaining why.
#
# This workflow fills that gap. It runs under `pull_request_target`, which
# executes in the base-repository context with a write-capable token. That is
# only safe because it never checks out or executes PR-controlled code: it
# reads the event payload and posts a comment, nothing else. Do NOT add a
# checkout or any step that runs PR content — that would hand a write token
# and secrets to arbitrary fork PRs.
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  notify-fork:
    name: Notify fork PR of label limitation
    # Fire only when a flow label lands on a fork PR. head.repo.full_name
    # comes from the event payload — no API call needed to detect the fork.
    if: |
      github.event.pull_request.head.repo.full_name != github.repository &&
      (github.event.label.name == 'address-feedback' ||
       github.event.label.name == 'tool-bot:address-feedback' ||
       github.event.label.name == 'review' ||
       github.event.label.name == 'tool-bot:review')
    runs-on: ubuntu-latest
    steps:
      - name: Comment on fork PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — gh needs the repo spelled out.
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ The \`${{ github.event.label.name }}\` flow can't run on PRs from forks. GitHub gives fork-triggered runs a read-only token and withholds secrets, so the bot can't comment or push fix commits. To use it, push your branch to this repository and open the PR from there — or address the feedback manually."
