on:
  pull_request:
    types: [labeled]

# Three jobs so no job holds both the LLM key and a GitHub write token:
#   start  — write token, no key: fork check, status comment, label removal
#   review — LLM key, read-only token: runs the bot, writes the comment to files
#   post   — write token, no key, no PR code: posts those files
jobs:
  start:
    name: Start review
    # Dual-match: both the prefixed (tool-bot:*) and original unprefixed label
    # names trigger. If your repo only has the prefixed labels (e.g. created by
    # scripts/create-labels.sh), you can drop the unprefixed alternative.
    if: contains(github.event.pull_request.labels.*.name, 'tool-bot:review') || contains(github.event.pull_request.labels.*.name, 'review')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      # Label edits on a PR go through the issues endpoint — without this the
      # removal below fails silently (|| true) and the trigger label stays on,
      # so every later `labeled` event re-runs the whole flow.
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No checkout in this job — gh needs the repo spelled out.
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check PR is not from a fork
        run: |
          HEAD_REPO=$(gh pr view $PR_NUMBER --json headRepository --jq '.headRepository.nameWithOwner')
          if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            # Fork runs get a read-only token and no secrets, so the log line
            # is the message. Fork PRs are reviewed by on-fork-pr-review.yml.
            echo "PR head is on fork $HEAD_REPO — fork PRs are reviewed by on-fork-pr-review.yml once a maintainer approves the fork-review environment."
            exit 1
          fi
      - name: Post status comment
        run: |
          gh pr comment $PR_NUMBER --body "🔍 Reviewing tool files — [view progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
      - name: Remove review label
        run: |
          # Remove whichever spelling(s) exist — prefixed and legacy.
          gh pr edit $PR_NUMBER --remove-label "tool-bot:review" || true
          gh pr edit $PR_NUMBER --remove-label "review" || true

  review:
    name: Review Tool Files
    needs: start
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    # Shared group with on-pr-feedback — see that file's note.
    concurrency:
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # refs/pull/<N>/head lives on the base repo; head.ref alone is just a
      # branch name.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
      - name: Restore config from default branch
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}
          git checkout FETCH_HEAD -- .gxy-tool-bot.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir gxy-tool-bot==0.2.2
      # The bot offers its planemo_test / run_in_conda (shell) tools whenever
      # planemo, micromamba or conda is on PATH, and review reads PR content
      # next to secrets — so none of them may be. PR CI already lints and tests.
      # The runner image symlinks /usr/bin/conda.
      - name: Keep shell tools off PATH
        run: |
          sudo rm -f /usr/bin/conda
          for t in planemo micromamba conda; do
            if command -v "$t" >/dev/null; then
              echo "::error::$t is on PATH, the review bot would get shell tools"
              exit 1
            fi
          done
      - name: Find tool directory
        id: find_tool_dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PR title format: "tool_dir: auto-generated tool wrapper (issue #N)"
          PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title --jq '.title' 2>/dev/null || echo "")
          TOOL_DIR=$(echo "$PR_TITLE" | cut -d':' -f1 | xargs)
          # Fallback: check for .tool-name in the PR branch (find, not a
          # glob test — a bare tools/*/ glob errors on multiple matches).
          TOOL_NAME_FILE=$(find tools -maxdepth 2 -name .tool-name 2>/dev/null | head -1)
          if [ -z "$TOOL_DIR" ] && [ -n "$TOOL_NAME_FILE" ]; then
            TOOL_DIR=$(head -1 "$TOOL_NAME_FILE" 2>/dev/null)
          fi
          # Fallback: derive from the PR's changed files under tools/
          if [ -z "$TOOL_DIR" ]; then
            TOOL_DIR=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep -oP '^tools/\K[^/]+' | sort -u | head -1)
            [ -n "$TOOL_DIR" ] && echo "Derived tool directory from PR diff: $TOOL_DIR"
          fi
          # Fallback: find directories with .xml files under tools/
          if [ -z "$TOOL_DIR" ]; then
            TOOL_DIR=$(find tools/ -name "*.xml" -not -name "macros.xml" -exec dirname {} \; 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
          fi
          if [ -z "$TOOL_DIR" ]; then
            echo "Could not determine tool directory from PR title, .tool-name, or XML files"
            exit 1
          fi
          # TOOL_DIR feeds paths under tools/ later — reject anything that
          # isn't a plain directory name (traversal via a retitled PR).
          # The first character must not be a dot: '.' and '..' would pass
          # [A-Za-z0-9_.-] but resolve outside tools/.
          if [[ ! "$TOOL_DIR" =~ ^[A-Za-z0-9_-][A-Za-z0-9_.-]*$ ]]; then
            echo "Refusing unsafe tool directory name: $TOOL_DIR"
            exit 1
          fi
          echo "tool_dir=$TOOL_DIR" >> $GITHUB_OUTPUT
          echo "Found tool directory: $TOOL_DIR"
      - name: Review tool files
        env:
          GXY_TOOL_BOT_API_KEY: ${{ secrets.GXY_TOOL_BOT_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gxy-tool-bot review \
            --pr ${{ github.event.pull_request.number }} \
            --config .gxy-tool-bot.yml \
            --tool-dir tools/${{ steps.find_tool_dir.outputs.tool_dir }} \
            --actor ${{ github.event.sender.login }} \
            --comment-dir "$RUNNER_TEMP/comments"
      - name: Upload comments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-comments
          path: ${{ runner.temp }}/comments/
          if-no-files-found: ignore

  post:
    name: Post review
    needs: [start, review]
    if: always() && needs.start.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The comments are model output: post them as plain bodies, never run them.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review-comments
          path: ${{ runner.temp }}/comments
      - name: Post comments
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/comments/*.md)
          for f in "${files[@]}"; do
            gh pr comment $PR_NUMBER --body-file "$f"
          done
          if [ "$REVIEW_RESULT" != "success" ] && [ ${#files[@]} -eq 0 ]; then
            gh pr comment $PR_NUMBER --body "⚠️ Review failed. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
