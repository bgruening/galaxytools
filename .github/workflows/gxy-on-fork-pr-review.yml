# Bot review for PRs from forks.
#
# Fork PRs get no secrets on `pull_request`, so this runs on
# `pull_request_target`, in the base repository with its secrets. That is
# only safe because nothing from the PR is executed: the job checks out the
# default branch, extracts the PR's tool files with `git archive` as plain
# data, and the reviewer has no shell tools. Do NOT add a checkout of the PR
# or any step that runs its content.
#
# Every push to a fork PR starts a run that waits on the `fork-review`
# environment; a required reviewer approves it for that exact commit.
#
# Setup:
#   - Environment `fork-review` with required reviewers (Settings →
#     Environments). Optionally give it its own GXY_TOOL_BOT_API_KEY, which
#     takes precedence over the repository secret, so it can be revoked on
#     its own.
#   - Public repositories block `pull_request_target` by default unless an
#     Actions event policy allows it (enforced from November 2026). Allow it
#     for this workflow only:
#       gh api -X POST repos/OWNER/REPO/actions/policies --input - <<'EOF'
#       {"name": "fork review", "enforcement": "active",
#        "conditions": {"workflow_path": {"include": [".github/workflows/gxy-on-fork-pr-review.yml"], "exclude": []}},
#        "rules": [{"type": "restrict_action_events", "parameters": {"allowed_events": ["pull_request_target"]}}]}
#       EOF
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

# Two jobs so no job holds both the LLM key and a GitHub write token:
#   review — LLM key, read-only token: reviews the files, writes the comment
#   post   — write token, no key, no PR content: posts it
jobs:
  review:
    name: Review fork PR
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: fork-review
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The commit the reviewer approved — never the branch, which can move.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Default branch only: config and workflow come from here, not the PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract the PR's tool files
        id: pr_files
        run: |
          TOOL_DIR=$(gh pr diff $PR_NUMBER --name-only | grep -oP '^tools/\K[^/]+' | sort -u | head -1)
          if [[ ! "$TOOL_DIR" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "No reviewable tool directory under tools/ in this PR (got '$TOOL_DIR')"
            exit 1
          fi
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          if ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "Approved commit $HEAD_SHA is not on the PR any more; the new push has its own run."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pr"
          git archive "$HEAD_SHA" "tools/$TOOL_DIR" | tar -x -C "$RUNNER_TEMP/pr"
          echo "tool_dir=$TOOL_DIR" >> $GITHUB_OUTPUT
          echo "Reviewing tools/$TOOL_DIR at $HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir gxy-tool-bot==0.2.2
      # The bot offers its planemo_test / run_in_conda (shell) tools whenever
      # planemo, micromamba or conda is on PATH. The runner image symlinks
      # /usr/bin/conda.
      - name: Keep shell tools off PATH
        run: |
          sudo rm -f /usr/bin/conda
          for t in planemo micromamba conda; do
            if command -v "$t" >/dev/null; then
              echo "::error::$t is on PATH, the review bot would get shell tools"
              exit 1
            fi
          done
      - name: Review tool files
        env:
          GXY_TOOL_BOT_API_KEY: ${{ secrets.GXY_TOOL_BOT_API_KEY }}
          GITHUB_REF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOL_DIR: ${{ steps.pr_files.outputs.tool_dir }}
        run: |
          gxy-tool-bot review \
            --pr $PR_NUMBER \
            --config .gxy-tool-bot.yml \
            --tool-dir "$RUNNER_TEMP/pr/tools/$TOOL_DIR" \
            --comment-dir "$RUNNER_TEMP/comments"
      - name: Upload comments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-comments
          path: ${{ runner.temp }}/comments/
          if-no-files-found: ignore

  post:
    name: Post review
    needs: review
    # Not when the review job was skipped (same-repo PR) or never approved.
    if: always() && (needs.review.result == 'success' || needs.review.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The comments are model output: post them as plain bodies, never run them.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review-comments
          path: ${{ runner.temp }}/comments
      - name: Post comments
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/comments/*.md)
          for f in "${files[@]}"; do
            gh pr comment $PR_NUMBER --body-file "$f"
          done
          if [ "$REVIEW_RESULT" != "success" ] && [ ${#files[@]} -eq 0 ]; then
            gh pr comment $PR_NUMBER --body "⚠️ Review failed. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
